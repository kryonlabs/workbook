name: Release Debian Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Debian package version
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config xvfb xdotool dpkg-dev \
            libsdl2-dev libcairo2-dev

      - name: Install the locked Ziran toolchain
        run: |
          set -eu
          commit=$(awk '/"toolchain"/ { found = 1 } found && /"commit"/ { gsub(/[",]/, "", $2); print $2; exit }' ziran.lock)
          git clone https://github.com/ziranlang/ziran.git "$RUNNER_TEMP/ziran"
          git -C "$RUNNER_TEMP/ziran" checkout "$commit"
          make -C "$RUNNER_TEMP/ziran" -j"$(nproc)" install-user
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Debian package
        run: make deb VERSION="${{ inputs.version }}"

      - name: Test
        run: make test-ci

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" "dist/workbook_${VERSION}_amd64.deb" \
            --title "Workbook ${VERSION}" \
            --notes "Debian package for Workbook ${VERSION}."
