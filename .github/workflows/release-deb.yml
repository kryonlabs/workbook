name: Release Debian Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Debian package version
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config dpkg-dev libsdl2-dev libgl1-mesa-dev libx11-dev \
            libgtk-3-dev libssl-dev zlib1g-dev libbrotli-dev libzstd-dev \
            libasound2-dev libpulse-dev libsamplerate0-dev

      - name: Build Debian package
        run: make deb VERSION="${{ inputs.version }}"

      - name: Test
        run: make test

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" "dist/workbook_${VERSION}_amd64.deb" \
            --title "Workbook ${VERSION}" \
            --notes "Debian package for Workbook ${VERSION}."
