[package]
tool = "kryon"
name = "workbook"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "d17c7aa1e093066ef03f307a45f6966dd9b29d4b"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "f123e8ba3e3a9d77e059004564f0189558d4f652"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.css]
git = "https://github.com/kryonlabs/css.git"
ref = "3799bb09332fe1fbb32991e3f83f61bad825d4e6"

[install]
bin = "workbook"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"

[tool.kryon.install]
profile = "desktop"
name = "Workbook"
comment = "Spreadsheet editor"
categories = "Office;Spreadsheet;"

[exports]
service = "src/service.zi"
grid = "src/grid.zi"
engine = "src/engine.zi"
