[package]
tool = "kryon"
name = "workbook"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "ebd19223fa18432066f5dfa53124640eea36fa94"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "9052a642a0de97e160bcdfd952d0766d0f4737fc"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.css]
git = "https://github.com/kryonlabs/css.git"
ref = "a5ab2bbef9e6e920edb869b978a87e534eb40a5a"

[install]
bin = "workbook"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"

[tool.kryon.install]
profile = "desktop"
name = "Workbook"
comment = "Spreadsheet editor"
categories = "Office;Spreadsheet;"

[exports]
service = "src/service.zi"
grid = "src/grid.zi"
engine = "src/engine.zi"
