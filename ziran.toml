[package]
tool = "kryon"
name = "workbook"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "036cb7b5d2630302e0b73a2336ccbfb6d0250be5"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "43e6ea3d76ded207e2be93ff82b2a609c3cfeb91"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.css]
git = "https://github.com/kryonlabs/css.git"
ref = "9ee24b3f70b9c7d776dc391cba15ba97533db227"

[install]
bin = "workbook"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"

[tool.kryon.install]
profile = "desktop"
name = "Workbook"
comment = "Spreadsheet editor"
categories = "Office;Spreadsheet;"

[exports]
service = "src/service.zi"
grid = "src/grid.zi"
engine = "src/engine.zi"
