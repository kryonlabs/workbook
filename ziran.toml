[package]
tool = "kryon"
name = "workbook"
entry = "src/app.zi"
module_roots = ["src", "tests", "previews"]
bridge_modules = ["app"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "9432a110709c4a4f72c4f732fcfc368e15213a54"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "facaace35051336a2a993d90d1bb7d7396543852"

[dependencies.mingcute]
git = "https://git.waozi.xyz/kryonlabs/mingcute.git"
ref = "9cc6872f75447c3a24c16764f9829d0f58751cb0"

[dependencies.css]
git = "https://git.waozi.xyz/kryonlabs/css.git"
ref = "7dd9fff21bd1721deea91071a2317d106e901208"

[install]
bin = "workbook"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"

[tool.kryon.install]
profile = "desktop"
name = "Workbook"
comment = "Spreadsheet editor"
categories = "Office;Spreadsheet;"

[exports]
service = "src/service.zi"
grid = "src/grid.zi"
engine = "src/engine.zi"
editor = "src/editor.zi"
