[package]
tool = "kryon"
name = "workbook"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "master"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "7dc62902389544bf8d1fb3a159152cbd3b889c78"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.kss]
git = "https://github.com/kryonlabs/kss.git"
ref = "d208dc030fe068ff8a40ed49444536736b4b45d6"

[install]
bin = "workbook"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"

[tool.kryon.install]
profile = "desktop"
name = "Workbook"
comment = "Spreadsheet editor"
categories = "Office;Spreadsheet;"

[exports]
service = "src/service.zi"
